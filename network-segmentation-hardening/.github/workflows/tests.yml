name: Network design checks

on:
  push:
    paths:
      - "network-segmentation-hardening/**"
  pull_request:
    paths:
      - "network-segmentation-hardening/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documented design
        run: python -m unittest discover -s network-segmentation-hardening/tests -v
